name: Security regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - name: Provide the Linux Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Provide OpenSSL for local certificate fixture on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: npm test
      - run: npm run test:electron
      - run: npm run test:toastir
      - run: npm run test:browser
      - run: npm run test:extended
      - run: npm run test:account
      - run: npm run test:ai
      - run: npm run test:manager
      - run: npm run audit:deps
      - run: npm run scan:secrets
      - run: npm run sbom
      - name: Build verified Windows portable app
        if: runner.os == 'Windows'
        run: npm run package:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: ButterToast-windows-x64
          path: artifacts/windows/ButterToast-win32-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.os }}
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
