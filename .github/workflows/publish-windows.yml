name: Publish Windows development build

on:
  workflow_dispatch:
    inputs:
      security_run_id:
        description: Successful Security regression run on main
        required: true
        type: string
      release_tag:
        description: New development release tag
        required: true
        default: v0.3.0-dev.1
        type: string

permissions:
  contents: read

concurrency:
  group: windows-development-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      SECURITY_RUN_ID: ${{ inputs.security_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require a successful trusted security run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id, tag, repo = (os.environ[k] for k in ('SECURITY_RUN_ID', 'RELEASE_TAG', 'GITHUB_REPOSITORY'))
          assert re.fullmatch(r'[0-9]+', run_id), 'Invalid run ID'
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+', tag), 'Use a development release tag'
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Security run must pass'
          assert run['event'] == 'push' and run['head_branch'] == 'main', 'Require a main push'
          assert run['head_repository']['full_name'] == repo, 'Foreign source repository'
          assert run['path'] == '.github/workflows/security.yml', 'Unexpected workflow'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha']), 'Invalid source commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"sha={run['head_sha']}\n")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the distribution's NSIS package
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nsis
      - name: Download the verified Windows build from that run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$SECURITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ButterToast-windows-x64 --dir artifacts/windows/ButterToast-win32-x64
      - name: Build the current-user installer
        run: node scripts/package-installer.mjs
      - name: Verify payload and prepare downloads
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, os
          root = Path('artifacts')
          folder = root / 'windows/ButterToast-win32-x64'
          version = json.loads(Path('package.json').read_text())['version']
          assert os.environ['RELEASE_TAG'].startswith(f'v{version}-dev.'), 'Tag/version mismatch'
          report = json.loads((folder / 'BUILD-VERIFICATION.json').read_text())
          def digest(p):
              with p.open('rb') as f:
                  return hashlib.file_digest(f, 'sha256').hexdigest()
          assert report['appVersion'] == version and report['embeddedAsarHeaderHashVerified']
          assert digest(folder / 'ButterToast.exe') == report['executableSha256']
          assert digest(folder / 'resources/app.asar') == report['asarSha256']
          installer = root / f'ButterToast-{version}-Setup-x64.exe'
          installer_report = json.loads(Path(str(installer) + '.json').read_text())
          assert installer.stat().st_size == installer_report['bytes'] and digest(installer) == installer_report['sha256']
          archive = root / f'ButterToast-{version}-Windows-x64.zip'
          with ZipFile(archive, 'w', compression=ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(folder.rglob('*')):
                  assert not p.is_symlink(), 'Unexpected payload symlink'
                  if p.is_file():
                      z.write(p, p.relative_to(folder.parent))
          with ZipFile(archive) as z:
              assert z.testzip() is None
              assert 'ButterToast-win32-x64/ButterToast.exe' in z.namelist()
          (root / 'SHA256SUMS.txt').write_text(''.join(f'{digest(p)}  {p.name}\n' for p in (installer, archive)))
          (root / 'release-notes.md').write_text(f'''# ButterToast Windows 개발 테스트 빌드

          Windows 11 x64용 코드 서명되지 않은 사전 테스트 버전입니다.

          - **{installer.name}**: 현재 사용자용 설치 프로그램입니다.
          - **{archive.name}**: 전체 압축을 해제한 뒤 `ButterToast-win32-x64/ButterToast.exe`를 실행하세요. DLL과 resources도 함께 필요합니다.
          - **Source code**는 소스 파일이며 실행 파일이 없습니다.
          - SHA256SUMS.txt, BUILD-VERIFICATION.json과 SBOM.cdx.json을 함께 제공합니다.

          소스: `{os.environ['SOURCE_SHA']}`. [Windows·Ubuntu 자동 검사](https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SECURITY_RUN_ID']})가 모두 통과한 Windows 빌드를 사용했습니다. 앱 payload, PE, fuse, 내장 ASAR 해시와 업로드 파일 해시를 확인합니다.

          탭·충돌 복구, 북마크·기록·다운로드·권한·Google 검색 테마, Supabase 계정 UI, 여러 AI 제공사 연결, 독립 AI 작업 공간과 승인 기반 조작을 포함합니다. 메인 UI는 오너의 3패널 디자인을 적용했습니다. 계정·상세 설정은 검증용 UI입니다.

          0.3 변경: 새벽빛 라이트/다크/시스템 테마, 로그인 계정 닉네임·소개·6종 아바타, 7종 꾸미기와 미리보기·저장·다시 불러오기, 문자/이모지를 대체한 로컬 SVG 아이콘. 프로필은 현재 사용자 Auth 메타데이터에만 저장하며 브라우징 데이터·AI 키·대화는 기기에 남습니다. 신원·revision 검증, 지연 응답 폐기, HTML/CSS/외부 아바타 주입 차단과 IPC 폭주 중 로그아웃을 검사합니다. 상세: [0.3 구현·검증](https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['SOURCE_SHA']}/docs/PROFILE-THEMES-0.3.md).

          프로필 저장·전환은 로컬 fixture로 검증했으며 실제 Supabase 프로필 쓰기·다른 기기에서 재읽기는 미검증입니다. 기기 간 실시간 갱신이나 계정별 브라우징 데이터 격리는 제공하지 않습니다. 기존 프로필 형식은 읽지만 새 꾸미기를 저장한 뒤 이전 버전으로의 다운그레이드 호환성은 보장하지 않습니다.

          실제 Windows 설치·제거, 실제 AI 추론, 일반 사용자 SMTP, 코드 서명과 운영 업데이트 검증은 남아 있습니다. 자동 업데이트는 비활성입니다. 자동 검사 통과는 취약점 부재를 보증하지 않습니다. 비공개 저장소에 접근 가능한 GitHub 계정으로 로그인해야 다운로드할 수 있습니다.
          '''.replace('\n          ', '\n'))
          PY
      - name: Upload, verify server digests, and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          root = Path('artifacts')
          version = json.loads(Path('package.json').read_text())['version']
          files = [root / f'ButterToast-{version}-Setup-x64.exe', root / f'ButterToast-{version}-Windows-x64.zip', root / 'SHA256SUMS.txt', root / 'windows/ButterToast-win32-x64/BUILD-VERIFICATION.json', root / 'windows/ButterToast-win32-x64/SBOM.cdx.json']
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          subprocess.run(['gh', 'release', 'create', tag, *map(str, files), '--repo', repo, '--target', os.environ['SOURCE_SHA'], '--title', f'ButterToast {version} — Windows 개발 테스트 빌드', '--notes-file', str(root / 'release-notes.md'), '--draft', '--prerelease'], check=True)
          api_url = subprocess.check_output(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'apiUrl', '--jq', '.apiUrl'], text=True).strip()
          release = json.loads(subprocess.check_output(['gh', 'api', api_url]))
          assert release['draft'] and release['prerelease'] and release['target_commitish'] == os.environ['SOURCE_SHA']
          assets = {a['name']: a for a in release['assets']}
          assert set(assets) == {p.name for p in files}, 'Unexpected release assets'
          for p in files:
              with p.open('rb') as f:
                  expected = 'sha256:' + hashlib.file_digest(f, 'sha256').hexdigest()
              assert assets[p.name]['state'] == 'uploaded' and assets[p.name]['size'] == p.stat().st_size
              assert assets[p.name].get('digest') == expected, f'Upload hash mismatch: {p.name}'
          subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--draft=false'], check=True)
          url = subprocess.check_output(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'url', '--jq', '.url'], text=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(url)
          PY
