<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ButterToast 계정</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="account.css"><script src="account.js" defer></script></head>
<body><main>
<h1>ButterToast 계정</h1>
<p class="hint">계정 없이도 브라우저를 사용할 수 있어요.</p>
<div id="auth-modes" role="group" aria-label="계정 작업"><button id="mode-login" aria-pressed="true">로그인</button><button id="mode-signup" aria-pressed="false">회원가입</button></div>
<form id="auth-form">
<label for="email">이메일</label><input id="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">비밀번호 <span id="password-hint"></span></label><input id="password" type="password" autocomplete="current-password" maxlength="1024" required>
<div id="confirm-field" hidden><label for="password-confirm">비밀번호 확인</label><input id="password-confirm" type="password" autocomplete="new-password" maxlength="1024"></div>
<label class="inline"><input id="show-password" type="checkbox"> 비밀번호 표시</label>
<button id="submit" type="submit" disabled>로그인</button>
</form><button id="recover" type="button">비밀번호 찾기</button>
<div id="signed-in" hidden><p id="signed-in-email"></p><p>앱을 종료하면 다시 로그인해야 합니다.</p>
<form id="password-form"><label for="current-password">현재 비밀번호 (복구 메일 인증 후에는 생략 가능)</label><input id="current-password" type="password" autocomplete="current-password" maxlength="1024">
<label for="new-password">새 비밀번호 (8자 이상)</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
<label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
<label for="reauth-code">재인증 코드 (요청된 경우)</label><input id="reauth-code" autocomplete="one-time-code" maxlength="128"><button id="reauthenticate" type="button">재인증 코드 받기</button><button id="password-update" type="submit">비밀번호 변경</button></form></div>
<p id="account-message" role="status" aria-live="polite"></p>
<button id="logout" hidden>로그아웃</button>
<p class="hint" id="session-note">ButterToast 계정의 로그인 상태는 방문 사이트의 로그인과 별도로 관리됩니다.</p>
</main></body></html>
