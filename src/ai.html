<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ButterToast AI</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="ai.css"><script src="ai-settings.js" defer></script><script src="ai.js" defer></script></head>
<body><header><strong>ButterToast AI</strong><button id="clear">새 대화</button><button id="hide" aria-label="AI 패널 닫기">×</button></header>
<main>
<details id="settings" open><summary>연결 설정</summary>
<form id="connection-form">
<label for="provider">API 형식</label><select id="provider"><option value="openai">OpenAI</option><option value="anthropic">Claude (Anthropic)</option><option value="compatible">OpenAI 호환 / 로컬</option></select>
<label for="endpoint">연결 주소</label><input id="endpoint" type="url" maxlength="2048" value="https://api.openai.com/v1" required>
<label for="api-key">API 키</label><input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="4096" placeholder="로컬 서버는 키 없이 연결 가능">
<label class="check"><input id="remember" type="checkbox"> OS 암호화로 저장</label><p class="hint" id="storage-hint">저장하지 않으면 이번 실행 중에만 키를 사용합니다.</p>
<div class="row"><button id="connect" type="submit">연결 확인</button><button id="restore" type="button">저장된 연결</button><button id="forget" type="button">키 삭제</button></div>
</form></details>
<p id="active-connection" class="hint">연결되지 않음</p><label for="model">모델</label><div class="row"><input id="model" list="models" maxlength="200" placeholder="연결 후 모델 선택 또는 ID 입력"><datalist id="models"></datalist><button id="choose-model">선택</button></div>
<details><summary>페이지 공유 · AI 작업</summary><p class="hint">공유할 내용은 전송 전에 미리 확인하세요. 입력란·숨김 내용은 제외하지만, 화면에 보이는 개인정보는 포함될 수 있습니다.</p>
<div class="row"><button id="share-human">현재 탭 읽기</button><button id="share-task">AI 작업 읽기</button></div>
<form id="task-form"><label for="task-url">별도 AI 작업 주소</label><input id="task-url" type="url" maxlength="4096" placeholder="https://…" required><div class="row"><button id="task-open" type="submit">작업 창 열기</button><button id="task-close" type="button">작업 종료</button></div></form></details>
<section id="context" hidden><div class="row"><strong id="context-origin"></strong><button id="remove-context">공유 취소</button></div><p class="hint">다음 전송에 포함될 내용</p><pre id="context-preview"></pre></section>
<div id="messages" role="log" aria-label="AI 대화"></div>
<section id="proposal" hidden><p id="proposal-description"></p><div class="row"><button id="approve">클릭 검토</button><button id="reject">거절</button></div></section>
<p id="ai-message" role="status" aria-live="polite"></p>
</main>
<footer><form id="chat-form"><label for="prompt">메시지</label><textarea id="prompt" rows="3" maxlength="12000" placeholder="AI에게 요청할 내용을 입력하세요" required></textarea><div class="row"><button id="send" type="submit" disabled>전송</button><button id="ai-stop" type="button">중단</button></div></form><p id="usage" class="hint">사용량은 서버가 보고한 토큰 기준입니다.</p><p class="hint">오류·중단 요청의 사용량은 포함되지 않을 수 있습니다.</p></footer>
</body></html>
