<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"><title>ButterToast</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><script src="tabs.js" defer></script><script src="toolbar.js" defer></script><script src="ui.js" defer></script></head><body>
<div class="tabstrip"><div class="tabs" id="tabs" role="tablist" aria-label="탭"></div><button id="new" title="새 탭" aria-label="새 탭" disabled>＋</button><button id="reopen" title="닫은 탭 다시 열기 (Ctrl+Shift+T)" aria-label="닫은 탭 다시 열기" disabled>↶</button><button id="move-left" title="현재 탭 왼쪽으로" aria-label="현재 탭 왼쪽으로" disabled>‹</button><button id="move-right" title="현재 탭 오른쪽으로" aria-label="현재 탭 오른쪽으로" disabled>›</button><button id="account-open" disabled>로그인</button></div>
<div class="toolbar"><button id="back" aria-label="뒤로">←</button><button id="forward" aria-label="앞으로">→</button><button id="reload" aria-label="새로고침">⟳</button><button id="stop" aria-label="로딩 중지" title="로딩 중지 (Esc)" disabled>×</button><span id="security" title="연결 방식"></span><form id="address-form"><input id="address" aria-label="주소 또는 검색어" autocomplete="off" placeholder="주소 또는 검색어 입력" disabled></form><button class="text-action" id="restart" title="현재 탭 다시 시작: 입력 내용은 사라지고 주소를 다시 엽니다" disabled>탭 재시작</button><button class="text-action" id="suspend" title="메모리 해제: 입력 내용은 사라집니다. 탭을 선택하면 주소를 다시 엽니다" disabled>메모리 해제</button><button class="text-action" id="privacy-toggle" title="현재 사이트의 추적 요청 차단 전환 (재실행 시 초기화)" aria-pressed="true" disabled>추적 차단</button></div>
<div id="message" role="status"></div></body></html>
