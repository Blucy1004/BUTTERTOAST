<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ButterToast</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><script src="icons.js" defer></script><script src="appearance.js" defer></script><script src="tabs.js" defer></script><script src="toolbar.js" defer></script><script src="workspace.js" defer></script><script src="ui.js" defer></script></head><body>
<header class="brandbar"><div class="brand">ButterToast</div><nav aria-label="패널과 계정"><button id="ai-stop-all" title="모든 AI 중지 (Ctrl+Shift+X)" disabled>AI 모두 중지</button><button id="theme-toggle" title="라이트 테마로 전환" aria-label="라이트 테마로 전환" disabled><span data-icon="sun" aria-hidden="true"></span></button><button id="butter-toggle" aria-label="Butter 접기 또는 펼치기"><span data-icon="menu" aria-hidden="true"></span> <span>Butter</span></button><button id="ai-toggle" disabled>Toast 열기</button><button id="account-open" disabled><span id="account-avatar" aria-hidden="true" data-icon="user"></span><span id="account-name">로그인</span></button></nav></header>
<p id="appearance-notice" role="status" hidden></p>
<aside id="butter-panel" class="panel"><header class="panel-title"><strong>Butter</strong><span class="full-label">탭 · 도구</span></header>
<div class="butter-actions"><button id="new" title="새 탭 (Ctrl+T)" aria-label="새 탭" disabled><span data-icon="plus" aria-hidden="true"></span> <span>새 탭</span></button><button id="reopen" title="닫은 탭 다시 열기 (Ctrl+Shift+T)" aria-label="닫은 탭 다시 열기" disabled><span data-icon="undo" aria-hidden="true"></span></button></div>
<div class="tab-search"><input id="tab-search" type="search" maxlength="120" placeholder="탭 검색" aria-label="제목·사이트로 탭 검색" title="탭 검색 (Ctrl+Shift+A)"></div>
<div class="tabs" id="tabs" role="tablist" aria-label="사람용 탭" aria-orientation="vertical"></div>
<p id="tab-empty" hidden>일치하는 탭이 없습니다.</p>
<div class="tab-order"><button id="move-left" title="탭 위로 이동" aria-label="탭 위로 이동" disabled><span data-icon="arrow-up" aria-hidden="true"></span></button><button id="move-right" title="탭 아래로 이동" aria-label="탭 아래로 이동" disabled><span data-icon="arrow-down" aria-hidden="true"></span></button></div>
<div class="butter-tools"><button id="new-window" aria-label="새 창 (Ctrl+N)"><span data-icon="plus" aria-hidden="true"></span> <span>새 창</span></button><button id="bookmark" aria-label="현재 탭 북마크 (Ctrl+D)" disabled><span data-icon="star" aria-hidden="true"></span> <span>북마크</span></button><button id="manager-open" aria-label="기록 · 다운로드 · 설정" disabled><span data-icon="settings" aria-hidden="true"></span> <span>기록 · 다운로드 · 설정</span></button><button id="ai-next" aria-label="다음 AI 작업 공간" title="독립 AI 1·2·3 전환" disabled><span data-icon="switch" aria-hidden="true"></span> <span>다음 AI 작업 공간</span></button></div>
<p class="butter-hint full-label">탭을 Toast로 드래그하거나<br>‘Toast에 보내기’를 누르세요.</p></aside>
<div id="left-splitter" class="splitter" role="separator" tabindex="0" aria-label="Butter 너비" aria-orientation="vertical" aria-valuemin="160" aria-valuemax="420"></div>
<section id="browser-panel" class="panel"><header class="panel-title"><strong>Browser</strong><span>내 브라우저</span><button id="delegate" title="현재 페이지를 별도 AI 세션에서 열기" disabled>Toast에 보내기 <span data-icon="arrow-up-right" aria-hidden="true"></span></button></header>
<div class="toolbar"><button id="back" aria-label="뒤로"><span data-icon="arrow-left" aria-hidden="true"></span></button><button id="forward" aria-label="앞으로"><span data-icon="arrow-right" aria-hidden="true"></span></button><button id="reload" aria-label="새로고침"><span data-icon="reload" aria-hidden="true"></span></button><button id="stop" aria-label="로딩 중지" title="로딩 중지 (Esc)" disabled><span data-icon="close" aria-hidden="true"></span></button><form id="address-form"><input list="address-suggestions" id="address" aria-label="주소 또는 검색어" autocomplete="off" placeholder="주소 또는 검색어" disabled><datalist id="address-suggestions"></datalist></form><span id="security" title="연결 방식"></span><button id="find-open" aria-label="페이지 내 찾기" title="페이지 내 찾기 (Ctrl+F)"><span data-icon="search" aria-hidden="true"></span></button></div>
<form id="find-bar" hidden><input id="find-text" maxlength="256" aria-label="페이지에서 찾을 내용" placeholder="페이지 내 찾기" autocomplete="off"><output id="find-count" aria-live="polite">0 / 0</output><button id="find-prev" type="button" aria-label="이전 결과"><span data-icon="arrow-up" aria-hidden="true"></span></button><button id="find-next" type="button" aria-label="다음 결과"><span data-icon="arrow-down" aria-hidden="true"></span></button><button id="find-close" type="button" aria-label="찾기 닫기"><span data-icon="close" aria-hidden="true"></span></button></form>
<div id="message" role="status"></div><div class="browser-empty"><strong>어디로 떠나볼까요?</strong><p>위 주소창에서 검색하거나 주소를 입력하세요.</p></div></section>
<div id="right-splitter" class="splitter" role="separator" tabindex="0" aria-label="Toast 너비" aria-orientation="vertical" aria-valuemin="300" aria-valuemax="720"></div>
<section id="toast-placeholder" class="panel"><header class="panel-title"><strong>Toast</strong><span>AI 작업 공간</span><button id="toast-collapse" aria-label="Toast 접기"><span data-icon="chevron-right" aria-hidden="true"></span></button></header><div class="toast-welcome"><p class="eyebrow">독립된 AI 브라우저</p><h1>작업을 Toast에<br>맡겨보세요.</h1><p>내 탭은 그대로,<br>AI는 별도 세션에서 작업합니다.</p><button id="open-toast">AI 연결 · 작업 열기 <span data-icon="arrow-right" aria-hidden="true"></span></button><p class="hint">탭을 이곳에 놓아도 시작할 수 있어요.</p></div></section>
<div id="drag-target" hidden>Toast에 보내기<span>원본 탭은 유지됩니다 · 쿠키는 공유하지 않습니다</span></div>
<footer class="utilitybar"><button id="restart" title="탭 재시작: 입력 내용은 사라집니다" disabled>탭 재시작</button><button id="suspend" title="메모리 해제: 입력 내용은 사라집니다" disabled>메모리 해제</button><button id="privacy-toggle" aria-pressed="true" disabled>추적 차단</button><span class="zoom-tools"><button id="zoom-out" aria-label="축소"><span data-icon="minus" aria-hidden="true"></span></button><button id="zoom-reset" title="확대 비율 초기화">100%</button><button id="zoom-in" aria-label="확대"><span data-icon="plus" aria-hidden="true"></span></button></span><button id="popup-open" hidden>차단한 팝업 확인</button><span id="app-version"></span></footer>
</body></html>
