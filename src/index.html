<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"><title>ButterToast</title><link rel="stylesheet" href="style.css"><script src="tabs.js" defer></script><script src="toolbar.js" defer></script><script src="ui.js" defer></script></head><body>
<div class="tabs" id="tabs" role="tablist" aria-label="탭"></div><button id="new" title="새 탭" aria-label="새 탭">＋</button>
<div class="toolbar"><button id="back" aria-label="뒤로">←</button><button id="forward" aria-label="앞으로">→</button><button id="reload" aria-label="새로고침">⟳</button><span id="security" title="연결 방식"></span><form id="address-form"><input id="address" aria-label="주소 또는 검색어" autocomplete="off" placeholder="주소 또는 검색어 입력"></form></div>
<div id="message" role="status"></div></body></html>
