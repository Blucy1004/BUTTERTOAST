<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ButterToast 관리</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="manager.css"><script src="icons.js" defer></script><script src="appearance.js" defer></script><script src="manager.js" defer></script></head><body>
<nav aria-label="브라우저 관리"><button data-section="bookmarks">북마크</button><button data-section="history">방문 기록</button><button data-section="downloads">다운로드</button><button data-section="settings">설정·권한</button><button data-section="audit">AI 실행 이력</button></nav>
<p id="status" role="status"></p><main>
<section id="bookmarks"><h1>북마크</h1><button id="bookmark-current">현재 탭 추가</button><input id="bookmark-filter" aria-label="북마크 검색" placeholder="북마크 검색"><div id="bookmark-list"></div></section>
<section id="history" hidden><h1>방문 기록</h1><button id="history-clear">전체 기록 삭제</button><input id="history-filter" aria-label="방문 기록 검색" placeholder="방문 기록 검색"><div id="history-list"></div></section>
<section id="downloads" hidden><h1>다운로드</h1><p>파일마다 저장 승인이 필요합니다. 완료된 파일은 자동 실행하지 않습니다. 목록은 이번 실행 동안 유지됩니다.</p><div id="download-list"></div></section>
<section id="settings" hidden><h1>설정</h1><form id="settings-form">
<label>검색엔진 <select id="search"><option value="google">Google</option><option value="brave">Brave</option><option value="duckduckgo">DuckDuckGo</option></select></label>
<label>Google 검색 테마 <select id="theme"><option value="off">사이트 기본</option><option value="light">밝게</option><option value="dark">어둡게</option></select></label>
<label><input id="remember-history" type="checkbox"> 방문 기록 저장</label><label><input id="restore-tabs" type="checkbox"> 종료 후 탭 주소 복원</label><button type="submit">설정 저장</button></form>
<button id="default-browser">OS 기본 브라우저 설정</button><button id="clear-site-data">웹사이트 데이터 삭제</button>
<h2>업데이트</h2><p id="update-status" role="status"></p><button id="update-check">새 버전 확인</button><button id="update-install">검증 후 설치</button>
<h2>사이트 권한</h2><p>HTTPS의 활성 탭에서 요청할 때 확인합니다. 카메라·마이크는 함께 관리합니다. 기기·화면 공유 권한은 차단합니다. 차단/다시 묻기를 선택하면 사용 중인 권한을 회수하기 위해 해당 사이트의 탭을 종료하고 복원 대기 상태로 바꿉니다. 입력 내용은 사라집니다.</p><div id="permission-list"></div></section>
<section id="audit" hidden><h1>AI 실행 이력</h1><p>시간·사이트·동작·결과만 기록하며 입력 값과 페이지 본문은 저장하지 않습니다.</p><button id="audit-clear">이력 삭제</button><div id="audit-list"></div></section>
</main></body></html>
